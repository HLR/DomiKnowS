[project]
name = "domiknows-primaldual-sample-vs-reinforcement-task"
version = "0.1.0"
description = "Comparison of DomiKnowS sample-loss constraint learning and ReinforcementProgram on one exact-count task."
requires-python = ">=3.12"
dependencies = [
    "domiknows[cpu]",
    "numpy>=2.0",
    "tqdm>=4.66.0",
]

[tool.uv]
package = false

[tool.uv.sources]
domiknows = { path = "../..", editable = true }
