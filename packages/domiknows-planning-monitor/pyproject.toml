[project]
name = "domiknows-planning-monitor"
version = "0.1.0"
description = "Portable finite-state plan monitor compiler and verifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
domiknows-planning-monitor = "domiknows_planning_monitor.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domiknows_planning_monitor"]
