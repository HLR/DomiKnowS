[project]
name = "domiknows-hf-generation-task"
version = "0.1.0"
description = "Offline HuggingFace-style constrained generation example for DomiKnowS."
requires-python = ">=3.12"
dependencies = [
    "domiknows[cpu]",
    "torch>=2.0.0",
    "transformers>=4.56.1",
]

[tool.uv]
package = false

[tool.uv.sources]
domiknows = { path = "../..", editable = true }
